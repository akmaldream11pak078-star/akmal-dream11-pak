<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Push Notification Debug</title>
<style>
  body { font-family: sans-serif; background:#111; color:#eee; padding:20px; font-size:16px; }
  button { padding:14px 20px; font-size:16px; margin:8px 0; width:100%; border-radius:8px; border:none; background:#f4c542; font-weight:bold; }
  pre { background:#000; color:#0f0; padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-all; font-size:12px; }
  .step { margin-bottom:6px; }
</style>
</head>
<body>
<h2>🔔 Push Notification Diagnostic</h2>
<button onclick="runTest()">Run Full Test</button>
<pre id="log">Tap the button above...</pre>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD0Z9cJeKbaP1TGGt-o7S769w08fgL59Sk",
    authDomain: "akmaldream11pak.firebaseapp.com",
    projectId: "akmaldream11pak",
    storageBucket: "akmaldream11pak.firebasestorage.app",
    messagingSenderId: "958695333536",
    appId: "1:958695333536:web:baf0f21406db5b8ba033c5"
  };
  const VAPID_KEY = "BCcjRpsGfk_z7CA1Zcttl5oiX4usn3bqE1_lG_M9_E94NCWxfDcUoYEO3sfMoLoC18s948JpRHccBQc49TfHww8";

  const logEl = document.getElementById('log');
  function log(msg) {
    logEl.textContent += "\n" + msg;
    console.log(msg);
  }

  window.runTest = async function() {
    logEl.textContent = "Starting test...";
    try {
      log("1. Checking browser support...");
      if (!('serviceWorker' in navigator)) { log("❌ Service Worker NOT supported"); return; }
      if (!('Notification' in window)) { log("❌ Notification API NOT supported"); return; }
      log("✅ Both supported");

      log("2. Current permission status: " + Notification.permission);

      log("3. Requesting permission...");
      const permission = await Notification.requestPermission();
      log("Permission result: " + permission);
      if (permission !== 'granted') { log("❌ Not granted, stopping"); return; }

      log("4. Registering service worker...");
      const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
      log("✅ Service worker registered: " + registration.scope);

      log("5. Waiting for service worker to be ready...");
      const readyReg = await navigator.serviceWorker.ready;
      log("✅ Service worker ready");

      log("6. Initializing Firebase app...");
      const app = initializeApp(firebaseConfig);
      log("✅ Firebase app initialized");

      log("7. Getting messaging instance...");
      const messaging = getMessaging(app);
      log("✅ Messaging instance created");

      log("8. Requesting FCM token (this is where it usually fails)...");
      const token = await getToken(messaging, {
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: readyReg
      });

      if (token) {
        log("✅✅✅ SUCCESS! Token received:");
        log(token);
      } else {
        log("❌ getToken returned empty/null token");
      }
    } catch (err) {
      log("❌ ERROR CAUGHT:");
      log(err.name + ": " + err.message);
      if (err.stack) log(err.stack);
    }
  };
</script>
</body>
</html>
